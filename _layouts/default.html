<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#102f50">
    {% seo %}
    <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
    <script src="{{ '/assets/site.js' | relative_url }}" defer></script>
  </head>
  <body{% if page.page_class %} class="{{ page.page_class }}"{% endif %}>
    <a class="skip-link" href="#main-content">Skip to content</a>
    {% include header.html %}
    <main id="main-content" tabindex="-1">{{ content }}</main>
    {% include footer.html %}
  </body>
</html>
